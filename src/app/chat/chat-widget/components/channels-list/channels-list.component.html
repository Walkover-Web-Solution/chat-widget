<div class="channels-main-container d-flex flex-column h-100">
    <div
        class="widget-header all-conversation"
        [style.background-color]="primaryColor"
        [style.background-image]="backgroundImage"
        [ngClass]="{ 'border-radius-none': isMobileSDK && sdkConfig?.borderRadiusDisable }"
    >
        <div class="header-row d-flex align-items-center w-100">
            <button (click)="backToChat()" class="btn-w-icon" mat-icon-button type="button" aria-label="Back">
                <svg width="26" height="26" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M19.2627 20.7375L13.5377 15L19.2627 9.2625L17.5002 7.5L10.0002 15L17.5002 22.5L19.2627 20.7375Z" fill="white"></path>
                </svg>
            </button>
            <h3 class="m-0">All conversations</h3>
            <button mat-button class="mat-faqs-btn flex-row-reverse ml-auto" (click)="enableChatView(false)" *ngIf="widgetShowFaq$ | async">
                FAQs
                <mat-icon class="material-symbols-outlined" aria-hidden="true" fontIcon="chevron_right"></mat-icon>
            </button>
        </div>
    </div>

    <div class="position-relative flex-1">
        <div class="channels-body-inner-container position-absolute overflow-auto">
            <div class="conversation-card">
                <ng-container *ngFor="let channel of channels$ | async; let i = index">
                    <msg91-old-channel
                        *ngIf="channel?.id"
                        [assignees]="channelAssignees$[channel?.channel] | async"
                        (click)="selectChannel(channel)"
                        [channel]="channel"
                    ></msg91-old-channel>
                </ng-container>
            </div>
        </div>
    </div>
</div>
