<button class="main-msg91-old-channel h-auto" mat-button type="button">
    <div class="old-message-list-card position-relative w-100 d-flex align-items-center">
        <div
            class="old-profile-group position-relative d-flex align-items-center justify-content-center"
            [ngClass]="{
                'singleInitial': assignees?.assignees?.length === 1,
                'multipleInitial': assignees?.assignees?.length > 1
            }"
        >
            <ng-container *ngFor="let assignee of assignees?.assignees; let i = index">
                <msg91-profile-name
                    [ngClass]="{
                        single: assignees?.assignees?.length === 1,
                        'old-profile-1': i === 0,
                        'old-profile-2': i === 1,
                        'old-profile-3': i === 2
                    }"
                    [hashCode]="assignee | getHashCode"
                    [shortName]="assignee | getShortName"
                    class="profile-name position-absolute"
                    [width]="assignees?.assignees?.length === 1 ? 40 : 22"
                    [height]="assignees?.assignees?.length === 1 ? 40 : 22"
                    [aProfileClass]="assignees?.assignees?.length === 1 ? 'profileLarge' : 'profileSmall'"
                >
                </msg91-profile-name>
            </ng-container>
            <span *ngIf="channel.widget_unread_count > 0" class="count" [attr.aria-label]="channel.widget_unread_count + ' unread'">
                {{ channel.widget_unread_count }}
            </span>
        </div>
        <div class="old-message-list-text-content d-flex flex-column flex-1 overflow-hidden">
            <span class="old-meta d-flex align-items-baseline">
                <span class="old-title text-dotted">{{ assignees?.assigneeName }}</span>
                <small class="old-time" *ngIf="channel?.last_message?.timetoken">
                    {{ channel?.last_message?.timetoken | timeConversion: 'timeAgo' }}
                </small>
            </span>
            <span class="old-preview text-dotted" [class.unread]="channel.widget_unread_count > 0">
                {{ channel?.last_message | lastConversion: 40 }}
            </span>
        </div>
        <span class="old-c-btn d-flex align-items-center justify-content-center" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6z" fill="currentColor" />
            </svg>
        </span>
    </div>
</button>
