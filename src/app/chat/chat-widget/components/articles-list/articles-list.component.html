<ul class="articles-list m-0 p-0">
    <ng-container *ngIf="articlesList">
        <li
            (click)="selectArticle(article.id)"
            (keydown.enter)="selectArticle(article.id)"
            *ngFor="let article of articlesList"
            class="folder-list position-relative cursor-pointer d-flex align-items-center w-auto font-14"
            role="button"
            tabindex="0"
            matRipple
        >
            <span class="article-icon d-flex align-items-center justify-content-center" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M7 3h7.17a2 2 0 0 1 1.42.59l3.82 3.82A2 2 0 0 1 20 8.83V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm1 9.25c0 .41.34.75.75.75h7.5a.75.75 0 0 0 0-1.5h-7.5a.75.75 0 0 0-.75.75Zm0 3.5c0 .41.34.75.75.75h5.5a.75.75 0 0 0 0-1.5h-5.5a.75.75 0 0 0-.75.75Z"
                        fill="currentColor"
                    />
                </svg>
            </span>
            <span [innerHTML]="article.formattedTitle | sanitizeHtml" class="word-break"></span>
            <svg class="row-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6z" fill="currentColor" />
            </svg>
        </li>
    </ng-container>
</ul>
