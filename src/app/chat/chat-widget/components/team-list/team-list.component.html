<div class="team-list-body-container flex-1 position-relative">
    <div class="team-list-body-inner-container">
        <ng-container *ngIf="teams$ | async as teams">
            <button (click)="selectTeam(team.id)" *ngFor="let team of teams" class="main-team-channel d-flex align-items-center text-left ml-0 w-100 fw-normal rounded-0" mat-button type="button">
                <div class="team-message-list-card position-relative d-flex align-items-center w-100">
                    <div
                        class="team-profile-group position-relative d-flex align-items-center justify-content-center"
                        *ngIf="(teamAssignees$[team.id] | async)?.length; else teamInitials"
                    >
                        <ng-container *ngIf="teamAssignees$[team.id] | async as assignees">
                        <ng-container *ngFor="let assignee of assignees; let i = index">
                            <msg91-profile-name
                                [ngClass]="{
                                    single: assignees?.length === 1,
                                    'team-profile-1': i === 0,
                                    'team-profile-2': i === 1,
                                    'team-profile-3': i === 2
                                }"
                                [hashCode]="assignee | getHashCode"
                                [shortName]="assignee | getShortName"
                                class="profile-name position-absolute"
                                [width]="22"
                                [height]="22"
                                [aProfileClass]="assignees?.length === 1 ? 'profileSingle' : 'profileSmall'"
                            >
                            </msg91-profile-name>
                        </ng-container>
                        </ng-container>
                    </div>
                    <ng-template #teamInitials>
                        <div class="team-profile-group d-flex align-items-center justify-content-center" aria-hidden="true">
                            <msg91-profile-name
                                [hashCode]="team.name | getHashCode"
                                [shortName]="team.name | getShortName"
                                [width]="36"
                                [height]="36"
                                [aProfileClass]="'profileSingle'"
                            ></msg91-profile-name>
                        </div>
                    </ng-template>

                    <div class="team-message-list-text-content d-flex flex-column ml-2 flex-1">
                        <strong class="text-capitalize d-block text-dotted">{{ team.name }}</strong>
                    </div>

                    <span class="team-c-btn d-flex align-items-center justify-content-center" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6z" fill="currentColor" />
                        </svg>
                    </span>
                </div>
            </button>
        </ng-container>
    </div>
</div>
